server:
  port: 9891
spring:
  application:
    name: identity-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/splitease_identity}
    username: ${POSTGRES_USER:splitease}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-characters}
    lifetime: PT1H
  refresh-token:
    lifetime: ${REFRESH_TOKEN_LIFETIME:P30D}
  email-verification:
    lifetime: ${EMAIL_VERIFICATION_LIFETIME:PT24H}
    logging-sender:
      enabled: ${EMAIL_VERIFICATION_LOGGING_ENABLED:true}
  login-throttle:
    maximum-attempts: ${LOGIN_MAXIMUM_ATTEMPTS:5}
    attempt-window: ${LOGIN_ATTEMPT_WINDOW:PT15M}
    block-duration: ${LOGIN_BLOCK_DURATION:PT15M}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:9897/eureka}
management.endpoints.web.exposure.include: health,info,prometheus

logging.pattern.level: "%5p [requestId:%X{requestId:-none}]"

# Small elastic pools for a local multi-service deployment.
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout: 60000
server.tomcat.threads.max: ${HTTP_MAX_THREADS:16}
server.tomcat.threads.min-spare: 1
server.tomcat.max-connections: 128
spring.jpa.properties.hibernate.default_batch_fetch_size: 32
