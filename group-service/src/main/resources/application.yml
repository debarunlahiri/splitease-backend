server.port: 9892
spring:
  application.name: group-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/splitease_groups}
    username: ${POSTGRES_USER:splitease}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:9897/eureka}
management.endpoints.web.exposure.include: health,info,prometheus
security.internal.service-key: ${INTERNAL_SERVICE_KEY:replace-with-an-internal-service-key}
groups.invitation-lifetime: ${GROUP_INVITATION_LIFETIME:P7D}

logging.pattern.level: "%5p [requestId:%X{requestId:-none}]"

# Small elastic pools for a local multi-service deployment.
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout: 60000
server.tomcat.threads.max: ${HTTP_MAX_THREADS:16}
server.tomcat.threads.min-spare: 1
server.tomcat.max-connections: 128
spring.jpa.properties.hibernate.default_batch_fetch_size: 32

clients.identity-service.base-url: ${IDENTITY_SERVICE_URL:http://localhost:9891}

spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer
outbox.publish-delay: PT2S
