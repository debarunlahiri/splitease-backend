server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates: [Path=/api/v1/auth/**,/api/v1/users/**]
        - id: group-service
          uri: lb://group-service
          predicates: [Path=/api/v1/groups/**]
        - id: expense-service
          uri: lb://expense-service
          predicates: [Path=/api/v1/expenses/**]
        - id: settlement-service
          uri: lb://settlement-service
          predicates: [Path=/api/v1/settlements/**]
        - id: subscription-service
          uri: lb://subscription-service
          predicates: [Path=/api/v1/subscriptions/**]
        - id: notification-service
          uri: lb://notification-service
          predicates: [Path=/api/v1/notifications/**]
security:
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-characters}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
