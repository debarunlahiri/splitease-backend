server.port: 8086
spring:
  application.name: notification-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/splitease_notifications}
    username: ${POSTGRES_USER:splitease}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include: health,info,prometheus
notifications.push:
  enabled: ${PUSH_DELIVERY_ENABLED:false}
  dispatch-delay: ${PUSH_DISPATCH_DELAY:PT5S}
