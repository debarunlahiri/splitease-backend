server.port: 9895
spring:
  application.name: subscription-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/splitease_subscriptions}
    username: ${POSTGRES_USER:splitease}
    password: ${POSTGRES_PASSWORD:change-me}
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:9897/eureka}
management.endpoints.web.exposure.include: health,info,prometheus
stores:
  google:
    enabled: ${GOOGLE_PLAY_VERIFICATION_ENABLED:false}
    package-name: ${GOOGLE_PLAY_PACKAGE_NAME:com.splitease.app}
    push-audience: ${GOOGLE_PLAY_PUSH_AUDIENCE:}
    push-service-account-email: ${GOOGLE_PLAY_PUSH_SERVICE_ACCOUNT_EMAIL:}
    push-subscription: ${GOOGLE_PLAY_PUSH_SUBSCRIPTION:}
  apple:
    enabled: ${APPLE_STORE_VERIFICATION_ENABLED:false}
    bundle-id: ${APPLE_BUNDLE_ID:com.splitease.app}
    app-apple-id: ${APPLE_APP_ID:0}
    environment: ${APPLE_STORE_ENVIRONMENT:PRODUCTION}
    root-certificate-paths: ${APPLE_ROOT_CERTIFICATE_PATHS:}

logging.pattern.level: "%5p [requestId:%X{requestId:-none}]"

# Small elastic pools for a local multi-service deployment.
spring.datasource.hikari.maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle: ${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout: 60000
server.tomcat.threads.max: ${HTTP_MAX_THREADS:16}
server.tomcat.threads.min-spare: 1
server.tomcat.max-connections: 128
spring.jpa.properties.hibernate.default_batch_fetch_size: 32
