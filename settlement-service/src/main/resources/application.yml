server.port: 8084
spring:
  application.name: settlement-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/splitease_settlements}
    username: ${POSTGRES_USER:splitease}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include: health,info,prometheus
clients.group-service.base-url: ${GROUP_SERVICE_URL:http://localhost:8082}
security.internal.service-key: ${INTERNAL_SERVICE_KEY:replace-with-an-internal-service-key}
outbox.publish-delay: PT2S
